services:
  db:
    image: postgis/postgis:15-3.3
    container_name: zetta_db
    environment:
      POSTGRES_USER: postZetta
      POSTGRES_PASSWORD: squadA
      POSTGRES_DB: zettaFire
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postZetta -d zettaFire"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: zetta_api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/zettaFire
      - SPRING_DATASOURCE_USERNAME=postZetta
      - SPRING_DATASOURCE_PASSWORD=squadA
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  pipeline:
    build:
      context: ./SrcDados
    container_name: zetta_pipeline
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=zettaFire
      - DB_USER=postZetta
      - DB_PASSWORD=squadA
      - PIPELINE_INTERVAL_SECONDS=1800
      - PIPELINE_ONCE=false
    volumes:
      - ./SrcDados:/app