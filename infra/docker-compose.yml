services:
  db:
    image: postgis/postgis:15-3.3
    container_name: zetta_db
    environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
    ports:
        - "${DB_PORT}:${DB_PORT}"
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 10
    volumes:
        - ./scripts/sql/triggers.sql:/docker-entrypoint-initdb.d/triggers.sql

  api:
    build: ../backend 
    container_name: zetta_api
    env_file:
      - .env
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:${DB_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  pipeline:
    build:
      context: ../dados
    container_name: zetta_pipeline
    depends_on:
      - db
      - api
    command: ["sh", "-c", "sleep 15 && python main.py"]
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - PIPELINE_INTERVAL_SECONDS=${PIPELINE_INTERVAL}
      - PIPELINE_ONCE=false
    volumes:
      - ../dados:/app